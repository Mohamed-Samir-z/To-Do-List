<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="bH7Sih1iBPjOuBt_BQwELSQqJuNPfi-bL6iFJZgd--I" />
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="icon.png" type="image/x-icon">
    <title>To-Do List</title>
  </head>
  <body>
    <div class="container">

      <div class="header-container">
        <div class="user-content">
          <h1 id="welcome-text">قائمة مهام...</h1>
          <button onclick="editName()" class="edit-btn">📝</button>
        </div>
      
        <div class="date-time-box">
          <span id="live-date"></span> | <span id="live-time"></span>
        </div>
      </div>

    <!-- <h1 class="title">To-Do List</h1> -->
      <div class="input-container">
        <input required autofocus minlength="3" maxlength="40" type="text" id="task-input" placeholder="Enter a task">
        <button id="add-button">Add</button>
      </div>
      <ul id="task-list">
      </ul>
      <button id="clear-button">Clear All</button>
    </div>
    <script src="sweetalert2.all.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
